name: Windows candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 Rust 检查组件
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: 固定当前工具链
        run: rustup override set stable
      - name: 记录构建环境
        run: |
          rustc --version --verbose
          cargo --version
          node --version
      - name: 从锁定 SDK 构建原生毛玻璃桥
        run: ./tools/build-acrylic.ps1
      - name: 从锁定 SDK 构建原生毛玻璃桥
        run: ./tools/build-acrylic.ps1
      - name: 公开文件与安全规则
        run: node tools/check-public.mjs
      - name: 前端与发布工具离线测试
        run: npm test
      - name: Rust 格式
        run: cargo fmt --check
      - name: 锁定依赖并预取
        run: cargo fetch --locked
      - name: Rust lint
        run: cargo clippy --offline --locked --all-targets -- -D warnings
      - name: Rust 离线业务测试
        run: cargo test --offline --locked
      - name: 安装固定 Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: NSIS 候选安装包
        run: ./tools/build-release.ps1 -Offline
      - name: 发行物校验值
        run: node tools/checksums.mjs target/release/bundle/nsis
      - name: 仅上传候选 artifact
        uses: actions/upload-artifact@v4
        with:
          name: jin10-reader-windows-x64-candidate
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
