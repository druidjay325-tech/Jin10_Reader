[package]
name = "jin10-reader"
version = "0.1.5"
edition = "2024"
description = "A quiet, independent Windows reader for user-authorized Jin10 MCP data"
license = "MIT"

[dependencies]
dirs = "6.0.0"
reqwest = "0.13"
rmcp = { version = "3.1.4", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
raw-window-handle = "0.6"
# Windows 原生窗口透明度（SetLayeredWindowAttributes）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Storage_FileSystem",
] }

[build-dependencies]
tauri-build = "2.6.3"

[profile.release]
strip = "symbols"
